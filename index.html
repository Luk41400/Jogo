<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Own the Road v3.0 | TOP-DOWN RACER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --f1-red: #E10600;
            --safety-cyan: #00F2FF;
            --caution-yellow: #FFD700;
            --dark-bg: #111;
            --glass: rgba(20, 20, 20, 0.95);
            --neon: 0 0 20px rgba(0, 242, 255, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-area {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 600px;
            max-height: 900px;
            background: #222;
            overflow: hidden;
            border: 5px solid #000;
            box-shadow: 0 0 80px rgba(0,0,0,0.9);
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* HUD */
        .hud-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .stat-badge {
            background: var(--glass);
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 700;
            border-left: 5px solid var(--safety-cyan);
            box-shadow: var(--neon);
            width: fit-content;
        }

        /* Durability Bar */
        .health-container {
            width: 150px;
            height: 10px;
            background: #333;
            border-radius: 5px;
            margin-top: 5px;
            overflow: hidden;
        }
        #health-fill { width: 100%; height: 100%; background: #00ff00; transition: 0.3s; }

        /* Speedometer */
        #speedometer {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: var(--glass);
            border: 4px solid #333;
            border-radius: 50%;
            z-index: 10;
        }
        .speed-gauge {
            width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #speed-val { font-size: 1.5rem; font-weight: 900; color: var(--safety-cyan); }
        .kmh { font-size: 0.6rem; color: #888; letter-spacing: 1px; }

        #map-container {
            position: absolute;
            top: 150px;
            right: 20px;
            width: 15px;
            height: 300px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            z-index: 10;
        }
        #p-pos {
            position: absolute;
            width: 25px; height: 10px; background: var(--f1-red); left: -5px; border-radius: 2px;
            box-shadow: 0 0 10px var(--f1-red);
        }

        /* SCREENS */
        .screen-ui {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 15, 0.98);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; padding: 30px; text-align: center;
        }

        .hide { display: none !important; }

        .title-glow {
            font-size: 3rem; font-weight: 900; text-transform: uppercase; margin-bottom: 20px;
            background: linear-gradient(to bottom, #fff, #888);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .btn-style {
            background: var(--f1-red); color: white; border: none; padding: 15px 40px;
            font-size: 1.2rem; font-weight: 900; cursor: pointer; border-radius: 4px;
            margin: 10px; transition: 0.3s;
        }
        .btn-style:hover { opacity: 0.8; transform: translateY(-2px); }

        /* QUIZ */
        #screen-quiz #quiz-box {
            background: #000; border: 2px solid var(--safety-cyan); border-radius: 20px;
            padding: 30px; max-width: 90%;
        }
        .opt-btn {
            background: #111; border: 1px solid #444; color: white; width: 100%;
            padding: 15px; margin: 5px 0; border-radius: 8px; cursor: pointer;
            font-size: 1rem; transition: 0.2s;
        }
        .opt-btn:hover { border-color: var(--safety-cyan); background: #1a1a1a; }

        /* REWARD */
        #reward-toast {
            position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: var(--caution-yellow); color: #000; padding: 10px 30px;
            border-radius: 50px; font-weight: 900; z-index: 60; display: none;
            animation: slideUp 0.5s ease-out;
        }
        @keyframes slideUp { from { bottom: 50px; opacity: 0; } to { bottom: 100px; opacity: 1; } }

    </style>
</head>
<body>

<div id="game-area">
    <canvas id="gameCanvas"></canvas>

    <div class="hud-overlay">
        <div class="stat-badge">DINHEIRO: <span id="cash-count" style="color:var(--caution-yellow)">0</span></div>
        <div class="stat-badge" style="border-left-color: var(--f1-red);">
            DURABILIDADE
            <div class="health-container">
                <div id="health-fill"></div>
            </div>
        </div>
        <div class="stat-badge">META: <span id="dist-count">0</span>/1000m</div>
    </div>

    <div id="speedometer">
        <div class="speed-gauge">
            <div id="speed-val">0</div>
            <div class="kmh">KM/H</div>
        </div>
    </div>

    <div id="map-container">
        <div id="p-pos"></div>
    </div>

    <div id="reward-toast">MISSAO COMPLETA: +$500</div>

    <!-- START -->
    <div id="screen-start" class="screen-ui">
        <h1 class="title-glow">OWN THE ROAD 3.0</h1>
        <p style="color: #888; margin-bottom: 30px; max-width: 400px;">
            Agora com durabilidade, sistema de ré e perguntas a cada 10 segundos! Compre o F1 definitivo.
        </p>
        <button class="btn-style" id="btn-play">INICIAR</button>
        <button class="btn-style" style="background:#444" id="btn-garage">GARAGEM</button>
    </div>

    <!-- GARAGE -->
    <div id="screen-garage" class="screen-ui hide">
        <h1 class="title-glow">GARAGEM</h1>
        <div id="garage-grid" style="width:100%; max-height: 50vh; overflow-y:auto; margin-bottom:20px;"></div>
        <button class="btn-style" id="btn-exit-garage">VOLTAR</button>
    </div>

    <!-- QUIZ -->
    <div id="screen-quiz" class="screen-ui hide">
        <div id="quiz-box">
            <h2 id="quiz-q" style="margin-bottom: 20px;">PERGUNTA?</h2>
            <div id="quiz-opts"></div>
        </div>
    </div>

    <!-- GAME OVER -->
    <div id="screen-over" class="screen-ui hide">
        <h1 id="over-t" class="title-glow">FIM DA LINHA</h1>
        <p id="over-res" style="margin-bottom: 30px;"></p>
        <button class="btn-style" id="btn-restart">RECOMECAR</button>
        <button class="btn-style" style="background:#555" id="btn-over-garage">GARAGEM</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // VEHICLE DATA
    const VEHICLES = [
        { id: 0, n: "Compacto", p: 0, s: 6, a: 0.12, c: "#999", type: 'hatch' },
        { id: 1, n: "Sedan Premium", p: 200, s: 9, a: 0.18, c: "#336", type: 'sedan' },
        { id: 2, n: "SUV Adventure", p: 500, s: 12, a: 0.22, c: "#262", type: 'suv' },
        { id: 3, n: "Esportivo GT", p: 1200, s: 16, a: 0.35, c: "#a33", type: 'sport' },
        { id: 4, n: "F1 ULTIMATE", p: 3000, s: 24, a: 0.65, c: "#E10600", type: 'f1' }
    ];

    const POOL = [
        { q: "Qual a distância de segurança ao ciclista?", a: "1,5 metro", o: ["0,5m", "2,0m", "5,0m"] },
        { q: "Luz amarela no semáforo significa?", a: "Atenção, pare se possível", o: ["Acelere", "Passe rápido", "Ligue o pisca"] },
        { q: "Beber e dirigir é permitido?", a: "Nunca (Lei Seca)", o: ["Só um copo", "Só se for cerveja", "Se não estiver tonto"] },
        { q: "Uso de celular dirigindo é:", a: "Infração Gravíssima", o: ["Permitido no sinal", "OK se for viva-voz", "Só para olhar GPS"] },
        { q: "Chuva forte exige:", a: "Reduzir e dobrar distância", o: ["Ligar o farol alto", "Aumentar velocidade", "Parar na pista"] },
        { q: "Velocidade em trânsito rápido sem sinalização?", a: "80km/h", o: ["60km/h", "100km/h", "40km/h"] },
        { q: "O cinto de segurança é obrigatório:", a: "Todos os passageiros", o: ["Só no banco frente", "Só em rodovias", "Não em baixa velocidade"] },
        { q: "O que significa 'Direção Defensiva'?", a: "Prever perigos antes deles ocorrerem", o: ["Correr para fugir do trânsito", "Saber se defender de assaltos", "Usar o carro para proteção"] }
    ];

    let game = {
        cash: parseInt(localStorage.getItem('v3_c')) || 0,
        owned: JSON.parse(localStorage.getItem('v3_o')) || [0],
        sel: parseInt(localStorage.getItem('v3_s')) || 0,
        hp: 100, d: 0, target: 10000, v: 0, active: false, px: 300, roadY: 0,
        obs: [], qTimer: 0, used: [], lt: 0
    };

    const keys = {};
    window.onkeydown = e => keys[e.key] = true;
    window.onkeyup = e => keys[e.key] = false;

    function refreshHUD() {
        document.getElementById('cash-count').innerText = game.cash;
        document.getElementById('dist-count').innerText = Math.floor(game.d / 10);
        document.getElementById('health-fill').style.width = game.hp + '%';
        if(game.hp < 40) document.getElementById('health-fill').style.background = '#ff0000';
        else document.getElementById('health-fill').style.background = '#00ff00';
        document.getElementById('speed-val').innerText = Math.abs(Math.floor(game.v * 10));
        const mapP = Math.max(0, Math.min(290, (game.d / game.target) * 290));
        document.getElementById('p-pos').style.bottom = mapP + 'px';
    }

    function sync() {
        localStorage.setItem('v3_c', game.cash);
        localStorage.setItem('v3_o', JSON.stringify(game.owned));
        localStorage.setItem('v3_s', game.sel);
    }

    function drawDetailedCar(ctx, x, y, color, type, isPlayer = true) {
        ctx.save();
        ctx.translate(x, y);
        
        // Base Body
        ctx.fillStyle = color;
        ctx.shadowBlur = isPlayer ? 10 : 0;
        ctx.shadowColor = color;
        
        switch(type) {
            case 'f1':
                // Nose
                ctx.beginPath(); ctx.roundRect(-10, -50, 20, 40, 5); ctx.fill();
                // Main body
                ctx.beginPath(); ctx.roundRect(-22, -15, 44, 50, 10); ctx.fill();
                // Wings
                ctx.fillStyle = '#111';
                ctx.fillRect(-35, -45, 70, 15); // Front wing
                ctx.fillRect(-35, 30, 70, 15);  // Rear wing
                // Suspension
                ctx.strokeStyle = '#222'; ctx.lineWidth = 4;
                ctx.strokeRect(-30, -30, 60, 5);
                ctx.strokeRect(-30, 20, 60, 5);
                break;
            case 'suv':
                ctx.beginPath(); ctx.roundRect(-25, -45, 50, 90, 8); ctx.fill();
                ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(-20, -35, 40, 20); // roof rack
                break;
            case 'sport':
                ctx.beginPath(); ctx.roundRect(-22, -45, 44, 90, 20); ctx.fill();
                ctx.fillStyle = '#222'; ctx.fillRect(-30, 35, 60, 10); // spoiler
                break;
            default: // Sedan / Hatch
                ctx.beginPath(); ctx.roundRect(-22, -45, 44, 90, 12); ctx.fill();
        }

        // Details common to all
        if (type !== 'f1') {
            // Windshields
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.beginPath(); ctx.roundRect(-18, -30, 36, 15, 2); ctx.fill(); // front
            ctx.beginPath(); ctx.roundRect(-18, 25, 36, 10, 2); ctx.fill(); // back
            // Mirrors
            ctx.fillStyle = color;
            ctx.fillRect(-28, -25, 6, 8); ctx.fillRect(22, -25, 6, 8);
        }

        // Wheels
        ctx.fillStyle = '#0a0a0a';
        if (type === 'f1') {
            ctx.fillRect(-35, -40, 15, 20); ctx.fillRect(20, -40, 15, 20);
            ctx.fillRect(-35, 15, 15, 25); ctx.fillRect(20, 15, 15, 25);
        } else {
            ctx.fillRect(-28, -35, 8, 18); ctx.fillRect(20, -35, 8, 18);
            ctx.fillRect(-28, 25, 8, 20); ctx.fillRect(20, 25, 8, 20);
        }
        
        ctx.restore();
    }

    function popQuiz() {
        if (!game.active) return;
        let p = POOL.filter((_, i) => !game.used.includes(i));
        if (p.length === 0) { game.used = []; p = POOL; }
        const idx = POOL.indexOf(p[Math.floor(Math.random() * p.length)]);
        game.used.push(idx);
        const qD = POOL[idx];

        document.getElementById('quiz-q').innerText = qD.q;
        const oG = document.getElementById('quiz-opts');
        oG.innerHTML = '';
        [qD.a, ...qD.o].sort(() => Math.random() - 0.5).forEach(opt => {
            const b = document.createElement('button');
            b.className = 'opt-btn'; b.innerText = opt;
            b.onclick = () => {
                if (opt === qD.a) { game.cash += 50; sync(); }
                else { game.v = 0; game.hp = Math.max(0, game.hp - 10); }
                document.getElementById('screen-quiz').classList.add('hide');
                game.active = true; game.qTimer = 0;
            };
            oG.appendChild(b);
        });
        document.getElementById('screen-quiz').classList.remove('hide');
        game.active = false;
    }

    function setup() {
        game.hp = 100; game.d = 0; game.v = 0; game.px = 300; game.qTimer = 0;
        game.obs = [];
        for(let i=0; i<40; i++) {
            game.obs.push({
                x: 180 + Math.random() * 240,
                y: -(i * 600) - 1000,
                w: 50, h: 90, color: ['#444','#224','#422','#44a'][i%4]
            });
        }
    }

    function loop(now) {
        if (game.active) {
            const dt = (now - game.lt) / 1000;
            game.lt = now;
            const car = VEHICLES[game.sel];

            // Controls (Forward & Reverse)
            if (keys['w'] || keys['ArrowUp']) game.v += car.a;
            else if (keys['s'] || keys['ArrowDown']) game.v -= car.a; // Reverse system
            else game.v *= 0.98;

            if (keys['a'] || keys['ArrowLeft']) game.px -= 6;
            if (keys['d'] || keys['ArrowRight']) game.px += 6;

            // Clamps
            game.v = Math.max(-car.s/2, Math.min(game.v, car.s)); // Max reverse is half max speed
            game.px = Math.max(160, Math.min(440, game.px));

            game.d += game.v;
            game.roadY = (game.roadY + game.v) % 120;

            game.qTimer += dt;
            if (game.qTimer >= 10) popQuiz(); // 10 seconds per user request

            game.obs.forEach(o => {
                o.y += game.v;
                if (Math.abs(o.x - game.px) < 45 && Math.abs(o.y - (canvas.height - 180)) < 85) {
                    game.hp -= 0.5; // Durability loss on contact
                    game.v *= 0.95;
                }
            });

            if (game.hp <= 0) {
                game.active = false;
                document.getElementById('over-res').innerText = "Veículo destruído! Dirija com mais prudência.";
                document.getElementById('screen-over').classList.remove('hide');
            }

            if (game.d >= game.target) {
                game.active = false; game.cash += 500; sync();
                document.getElementById('reward-toast').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('reward-toast').style.display = 'none';
                    document.getElementById('over-t').innerText = "VITORIA!";
                    document.getElementById('over-res').innerText = "Excelente! Você Ganhou $500.";
                    document.getElementById('screen-over').classList.remove('hide');
                }, 2000);
            }
            refreshHUD();
        }

        // RENDER
        ctx.fillStyle = '#3a6631'; ctx.fillRect(0,0,canvas.width,canvas.height); // Grass
        ctx.fillStyle = '#222'; ctx.fillRect(150, 0, 300, canvas.height); // Road
        ctx.fillStyle = '#fff'; ctx.fillRect(150,0,8,canvas.height); ctx.fillRect(442,0,8,canvas.height);
        
        ctx.setLineDash([40,40]); ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=4;
        ctx.beginPath(); ctx.moveTo(300, -120 + game.roadY); ctx.lineTo(300, canvas.height+120+game.roadY);
        ctx.stroke(); ctx.setLineDash([]);

        // NPC CARS (Obstacles as cars)
        game.obs.forEach(o => {
            drawDetailedCar(ctx, o.x, o.y + o.h/2, o.color, 'sedan', false);
        });

        // PLAYER CAR
        const selV = VEHICLES[game.sel];
        drawDetailedCar(ctx, game.px, canvas.height - 180, selV.c, selV.type, true);

        requestAnimationFrame((t) => {
            if(!game.active) game.lt = t;
            loop(t);
        });
    }

    // UI BUTTONS
    document.getElementById('btn-play').onclick = () => {
        setup(); game.active = true; game.lt = performance.now();
        document.getElementById('screen-start').classList.add('hide');
    };
    document.getElementById('btn-garage').onclick = () => {
        const g = document.getElementById('garage-grid'); g.innerHTML = '';
        VEHICLES.forEach(v => {
            const has = game.owned.includes(v.id); const isS = game.sel === v.id;
            const c = document.createElement('div');
            c.className = `item-card ${isS ? 'active' : ''}`;
            c.innerHTML = `<div><b>${v.n}</b><br><span style="color:var(--caution-yellow)">${has ? 'ADQUIRIDO' : '$'+v.p}</span></div><button class="btn-style" style="margin:0; padding:10px 20px;">${has ? (isS ? 'USANDO' : 'EQUIPAR') : 'COMPRAR'}</button>`;
            c.querySelector('button').onclick = () => {
                if(!has && game.cash >= v.p) { game.cash -= v.p; game.owned.push(v.id); sync(); }
                else if(has) game.sel = v.id;
                sync(); document.getElementById('btn-garage').click();
            };
            g.appendChild(c);
        });
        document.getElementById('screen-garage').classList.remove('hide');
    };
    document.getElementById('btn-exit-garage').onclick = () => document.getElementById('screen-garage').classList.add('hide');
    document.getElementById('btn-restart').onclick = () => {
        setup(); game.active = true; game.lt = performance.now();
        document.getElementById('screen-over').classList.add('hide');
    };
    document.getElementById('btn-over-garage').onclick = () => {
        document.getElementById('screen-over').classList.add('hide');
        document.getElementById('btn-garage').click();
    };

    function boot() {
        canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
        refreshHUD(); loop(performance.now());
    }
    window.onresize = boot;
    boot();

</script>
</body>
</html>

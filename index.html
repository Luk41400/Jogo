<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Own the Road | Top-Down Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --f1-red: #E10600;
            --safety-cyan: #00F2FF;
            --caution-yellow: #FFD700;
            --dark-bg: #1A1A1A;
            --glass: rgba(30, 30, 30, 0.9);
            --neon: 0 0 15px rgba(0, 242, 255, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background-color: #222;
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 600px; /* Portrait style for top-down mobile-ready feel */
            max-height: 900px;
            background: #333;
            overflow: hidden;
            border: 4px solid #111;
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* --- UI OVERLAYS --- */
        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .stat-box {
            background: var(--glass);
            border-bottom: 3px solid var(--safety-cyan);
            padding: 10px 15px;
            border-radius: 4px;
            font-weight: 700;
            box-shadow: var(--neon);
        }

        .money-val { color: var(--caution-yellow); }

        /* --- MINI MAP --- */
        #mini-map {
            position: absolute;
            top: 100px;
            right: 20px;
            width: 30px;
            height: 200px;
            background: rgba(0,0,0,0.5);
            border: 2px solid white;
            z-index: 10;
        }
        #player-marker {
            position: absolute;
            left: 5px;
            width: 20px;
            height: 4px;
            background: var(--f1-red);
            border-radius: 2px;
        }

        /* --- SCREENS --- */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
            text-align: center;
        }

        .hidden { display: none !important; }

        h1 { font-size: 2.5rem; margin-bottom: 15px; color: var(--safety-cyan); }
        .btn {
            background: var(--f1-red);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 20px;
            transition: 0.2s;
        }
        .btn:hover { transform: scale(1.05); }

        /* --- GARAGE --- */
        #garage-screen { background: #111; }
        .car-selector {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 100%;
            max-height: 60vh;
            overflow-y: auto;
            padding: 10px;
        }
        .car-card {
            background: #222;
            border: 2px solid #333;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
        }
        .car-card.selected { border-color: var(--safety-cyan); background: #2a2a2a; }
        .car-info { text-align: left; }
        .car-name { font-weight: 900; font-size: 1.2rem; }
        .car-price { color: var(--caution-yellow); margin-top: 5px; }

        /* --- QUIZ --- */
        #quiz-screen { background: rgba(0,0,20,0.95); }
        .question-text { font-size: 1.4rem; margin-bottom: 30px; font-weight: 700; }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 100%;
        }
        .option-btn {
            background: #333;
            border: 2px solid var(--safety-cyan);
            color: white;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }
        .option-btn:hover { background: var(--safety-cyan); color: black; }

        /* --- MESSAGES --- */
        #msg-popup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--f1-red);
            padding: 15px 30px;
            font-weight: 900;
            font-size: 1.5rem;
            z-index: 50;
            border-radius: 10px;
            display: none;
            animation: bounce 0.5s infinite alternate;
        }
        @keyframes bounce { from { transform: translate(-50%, -55%); } to { transform: translate(-50%, -45%); } }

    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div class="hud">
        <div class="stat-box">DINHEIRO: <span class="money-val">$</span><span id="money-display">0</span></div>
        <div class="stat-box">DIST: <span id="dist-display">0</span>m</div>
    </div>

    <div id="mini-map">
        <div id="player-marker"></div>
    </div>

    <div id="msg-popup">SUCESSO! +$500</div>

    <!-- START SCREEN -->
    <div id="start-screen" class="screen">
        <h1>OWN THE ROAD</h1>
        <p>Pilote com responsabilidade. Responda perguntas e chegue ao fim para ganhar dinheiro!</p>
        <button class="btn" id="start-btn">INICIAR CORRIDA</button>
        <button class="btn" style="background:#555" id="garage-btn">GARAGEM</button>
    </div>

    <!-- GARAGE SCREEN -->
    <div id="garage-screen" class="screen hidden">
        <h1>GARAGEM</h1>
        <div class="car-selector" id="car-list">
            <!-- Cars injected here -->
        </div>
        <button class="btn" id="close-garage">VOLTAR</button>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quiz-screen" class="screen hidden">
        <div class="question-text" id="quiz-question">Pergunta aqui?</div>
        <div class="options-grid" id="quiz-options">
            <!-- Options injected here -->
        </div>
    </div>

    <!-- GAME OVER SCREEN -->
    <div id="game-over-screen" class="screen hidden">
        <h1 id="over-title">FIM DE JOGO</h1>
        <p id="over-msg"></p>
        <button class="btn" id="retry-btn">TENTAR NOVAMENTE</button>
        <button class="btn" style="background:#555" id="go-garage">IR PARA GARAGEM</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // --- CAR DATA ---
    const CARS = [
        { id: 0, name: "Popular", price: 0, speed: 6, accel: 0.1, color: "#aaa" },
        { id: 1, name: "Sedan Premium", price: 200, speed: 8, accel: 0.15, color: "#44a" },
        { id: 2, name: "SUV de Luxo", price: 500, speed: 10, accel: 0.2, color: "#a4a" },
        { id: 3, name: "Super Esporte", price: 1200, speed: 14, accel: 0.3, color: "#fa0" },
        { id: 4, name: "Monoposto F1", price: 3000, speed: 20, accel: 0.5, color: "#e10600" }
    ];

    // --- QUESTIONS ---
    const QUESTIONS = [
        { q: "Qual a distância mínima ao ultrapassar ciclista?", a: "1,5 metro", o: ["0,5 metro", "2 metros", "1 metro"] },
        { q: "O que indica a luz amarela do semáforo?", a: "Atenção (parar se possível)", o: ["Acelerar", "Passar rápido", "Pode seguir"] },
        { q: "Qual o limite de álcool para dirigir?", a: "Zero absoluto", o: ["Uma taça de vinho", "Um copo de cerveja", "0.5mg/l"] },
        { q: "O uso do celular é permitido em qual situação?", a: "Apenas parado e desligado", o: ["No viva-voz", "Em semáforos", "Para olhar GPS"] },
        { q: "Qual a função do cinto de segurança?", a: "Reter o corpo em colisões", o: ["Evitar multas", "Apenas estética", "Conforto"] },
        { q: "Pedestre tem preferência na faixa?", a: "Sempre (exceto sinal verde)", o: ["Nunca", "Só se for idoso", "Só se o carro parar"] },
        { q: "O que significa a placa 'PARE'?", a: "Parada OBRIGATÓRIA", o: ["Reduzir velocidade", "Olhar e passar", "Parar se houver carro"] },
        { q: "Em caso de chuva, o que fazer?", a: "Reduzir e manter distância", o: ["Ligar o pisca-alerta", "Manter a velocidade", "Parar na pista"] }
    ];

    // --- GAME STATE ---
    let state = {
        money: parseInt(localStorage.getItem('otr_money')) || 0,
        ownedCars: JSON.parse(localStorage.getItem('otr_cars')) || [0],
        currentCarId: parseInt(localStorage.getItem('otr_current')) || 0,
        distance: 0,
        trackLength: 10000,
        speed: 0,
        playing: false,
        playerX: 300,
        roadOffset: 0,
        obstacles: [],
        quizTimer: 0,
        usedQuestions: [],
        lastTime: 0
    };

    const keys = {};
    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    // --- UI UPDATES ---
    function updateUI() {
        document.getElementById('money-display').innerText = state.money;
        document.getElementById('dist-display').innerText = Math.floor(state.distance / 10);
        const marker = document.getElementById('player-marker');
        const progress = (state.distance / state.trackLength) * 196;
        marker.style.bottom = progress + 'px';
    }

    function save() {
        localStorage.setItem('otr_money', state.money);
        localStorage.setItem('otr_cars', JSON.stringify(state.ownedCars));
        localStorage.setItem('otr_current', state.currentCarId);
    }

    // --- GARAGE LOGIC ---
    function openGarage() {
        const list = document.getElementById('car-list');
        list.innerHTML = '';
        CARS.forEach(car => {
            const isOwned = state.ownedCars.includes(car.id);
            const isSelected = state.currentCarId === car.id;
            const div = document.createElement('div');
            div.className = `car-card ${isSelected ? 'selected' : ''}`;
            div.innerHTML = `
                <div class="car-info">
                    <div class="car-name">${car.name}</div>
                    <div class="car-price">${isOwned ? 'ADQUIRIDO' : '$' + car.price}</div>
                    <div style="font-size:0.8rem; color:#888">Velocidade: ${car.speed} | Acel: ${car.accel}</div>
                </div>
                <button class="btn" style="margin:0; padding:8px 15px; background:${isOwned ? (isSelected ? '#555' : 'var(--safety-cyan)') : 'var(--f1-red)'}">
                    ${isOwned ? (isSelected ? 'EM USO' : 'SELECIONAR') : 'COMPRAR'}
                </button>
            `;
            div.querySelector('button').onclick = () => {
                if (!isOwned) {
                    if (state.money >= car.price) {
                        state.money -= car.price;
                        state.ownedCars.push(car.id);
                        save();
                        openGarage();
                    } else {
                        alert("Dinheiro insuficiente!");
                    }
                } else {
                    state.currentCarId = car.id;
                    save();
                    openGarage();
                }
            };
            list.appendChild(div);
        });
        document.getElementById('garage-screen').classList.remove('hidden');
    }

    // --- QUIZ LOGIC ---
    function triggerQuiz() {
        if (!state.playing) return;
        
        let available = QUESTIONS.filter((_, i) => !state.usedQuestions.includes(i));
        if (available.length === 0) {
            state.usedQuestions = []; // Reset if all used
            available = QUESTIONS;
        }

        const qIdx = QUESTIONS.indexOf(available[Math.floor(Math.random() * available.length)]);
        state.usedQuestions.push(qIdx);
        const q = QUESTIONS[qIdx];

        const screen = document.getElementById('quiz-screen');
        document.getElementById('quiz-question').innerText = q.q;
        const optionsEl = document.getElementById('quiz-options');
        optionsEl.innerHTML = '';

        const allOptions = [q.a, ...q.o].sort(() => Math.random() - 0.5);
        allOptions.forEach(opt => {
            const b = document.createElement('button');
            b.className = 'option-btn';
            b.innerText = opt;
            b.onclick = () => {
                if (opt === q.a) {
                    state.money += 20; // Bonus for correct
                    save();
                    updateUI();
                } else {
                    state.speed = 0; // Penalty
                }
                screen.classList.add('hidden');
                state.playing = true;
                state.quizTimer = 0;
            };
            optionsEl.appendChild(b);
        });

        screen.classList.remove('hidden');
        state.playing = false;
    }

    // --- GAMEPLAY ---
    function init() {
        state.distance = 0;
        state.speed = 0;
        state.playerX = canvas.width / 2;
        state.obstacles = [];
        state.quizTimer = 0;
        spawnObstacles();
    }

    function spawnObstacles() {
        for(let i = 0; i < 50; i++) {
            state.obstacles.push({
                x: 150 + Math.random() * 300,
                y: -(i * 600) - 1000,
                w: 60,
                h: 100
            });
        }
    }

    function update(time) {
        if (!state.playing) return;
        const dt = (time - state.lastTime) / 1000;
        state.lastTime = time;

        const car = CARS[state.currentCarId];

        // Controls
        if (keys['ArrowUp'] || keys['w']) state.speed += car.accel;
        else if (keys['ArrowDown'] || keys['s']) state.speed -= 0.3;
        else state.speed *= 0.98;

        if (keys['ArrowLeft'] || keys['a']) state.playerX -= 5;
        if (keys['ArrowRight'] || keys['d']) state.playerX += 5;

        state.speed = Math.max(0, Math.min(state.speed, car.speed));
        state.playerX = Math.max(150, Math.min(450, state.playerX));

        state.distance += state.speed;
        state.roadOffset = (state.roadOffset + state.speed) % 100;

        // Quiz Timer
        state.quizTimer += dt;
        if (state.quizTimer >= 12) {
            triggerQuiz();
        }

        // Collision Check
        state.obstacles.forEach(o => {
            o.y += state.speed;
            if (Math.abs(o.x - state.playerX) < 40 && Math.abs(o.y - (canvas.height - 150)) < 80) {
                gameOver("COLISÃO!", "Você bateu em um obstáculo. Lembre-se: manter a atenção é vital.");
            }
        });

        // Win check
        if (state.distance >= state.trackLength) {
            win();
        }

        updateUI();
    }

    function draw() {
        const w = canvas.width;
        const h = canvas.height;

        // Grass
        ctx.fillStyle = '#2d5a27';
        ctx.fillRect(0,0,w,h);

        // Road
        ctx.fillStyle = '#444';
        ctx.fillRect(100, 0, 400, h);

        // Side lines
        ctx.fillStyle = '#fff';
        ctx.fillRect(100, 0, 10, h);
        ctx.fillRect(390, 0, 10, h);

        // Dashed line
        ctx.setLineDash([40, 40]);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(w/2, 0 + state.roadOffset);
        ctx.lineTo(w/2, h + state.roadOffset);
        ctx.stroke();
        ctx.setLineDash([]);

        // Obstacles
        ctx.fillStyle = '#833';
        state.obstacles.forEach(o => {
            ctx.beginPath();
            ctx.roundRect(o.x - o.w/2, o.y, o.w, o.h, 5);
            ctx.fill();
            // Warning icons
            ctx.fillStyle = '#fff';
            ctx.font = '20px Arial';
            ctx.fillText('!', o.x - 5, o.y + o.h/2);
            ctx.fillStyle = '#833';
        });

        // Player
        const car = CARS[state.currentCarId];
        drawCar(state.playerX, h - 150, car.color);

        requestAnimationFrame((t) => {
            update(t);
            draw();
        });
    }

    function drawCar(x, y, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect(x - 20, y, 40, 80, 5);
        ctx.fill();
        // Windshield
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.fillRect(x - 15, y + 15, 30, 20);
        // Wheels
        ctx.fillStyle = '#000';
        ctx.fillRect(x - 25, y + 10, 10, 15);
        ctx.fillRect(x + 15, y + 10, 10, 15);
        ctx.fillRect(x - 25, y + 55, 10, 15);
        ctx.fillRect(x + 15, y + 55, 10, 15);
    }

    function win() {
        state.playing = false;
        state.money += 500;
        save();
        const pop = document.getElementById('msg-popup');
        pop.style.display = 'block';
        setTimeout(() => {
            pop.style.display = 'none';
            gameOver("CORRIDA FINALIZADA", "Parabéns! Você chegou ao fim com segurança e ganhou $500.");
        }, 2000);
    }

    function gameOver(title, msg) {
        state.playing = false;
        document.getElementById('over-title').innerText = title;
        document.getElementById('over-msg').innerText = msg;
        document.getElementById('game-over-screen').classList.remove('hidden');
    }

    // --- BUTTONS ---
    document.getElementById('start-btn').onclick = () => {
        document.getElementById('start-screen').classList.add('hidden');
        init();
        state.playing = true;
        state.lastTime = performance.now();
    };

    document.getElementById('garage-btn').onclick = openGarage;
    document.getElementById('close-garage').onclick = () => {
        document.getElementById('garage-screen').classList.add('hidden');
    };

    document.getElementById('retry-btn').onclick = () => {
        document.getElementById('game-over-screen').classList.add('hidden');
        init();
        state.playing = true;
        state.lastTime = performance.now();
    };

    document.getElementById('go-garage').onclick = () => {
        document.getElementById('game-over-screen').classList.add('hidden');
        openGarage();
    };

    function resize() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
    }
    window.onresize = resize;
    resize();
    updateUI();
    draw();

</script>
</body>
</html>

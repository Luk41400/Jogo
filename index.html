<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Own the Road v2.0 | TOP-DOWN RACER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --f1-red: #E10600;
            --safety-cyan: #00F2FF;
            --caution-yellow: #FFD700;
            --dark-bg: #1A1A1A;
            --glass: rgba(30, 30, 30, 0.95);
            --neon: 0 0 20px rgba(0, 242, 255, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background-color: #111;
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-area {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 600px;
            max-height: 900px;
            background: #222;
            overflow: hidden;
            border: 5px solid #000;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* HUD */
        .hud-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .stat-badge {
            background: var(--glass);
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 700;
            border-left: 5px solid var(--safety-cyan);
            box-shadow: var(--neon);
            width: fit-content;
        }

        .money-text { color: var(--caution-yellow); font-family: 'Outfit', sans-serif; font-size: 1.2rem; }

        /* MINI MAP */
        #map-container {
            position: absolute;
            top: 150px;
            right: 20px;
            width: 15px;
            height: 300px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.2);
            z-index: 10;
        }
        #p-pos {
            position: absolute;
            width: 25px;
            height: 10px;
            background: var(--f1-red);
            left: -5px;
            border-radius: 2px;
            box-shadow: 0 0 10px var(--f1-red);
        }

        /* SCREENS */
        .screen-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 15, 0.98);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 30px;
            text-align: center;
        }

        .hide { display: none !important; }

        .title-glow {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(to bottom, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .btn-style {
            background: var(--f1-red);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
            border-radius: 4px;
            margin: 10px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: inherit;
        }
        .btn-style:hover { padding: 15px 50px; box-shadow: 0 0 30px rgba(225, 6, 0, 0.4); }

        /* GARAGE */
        #garage-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-height: 50vh;
            overflow-y: auto;
            margin: 20px 0;
            padding-right: 10px;
        }
        .item-card {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-card.active { border: 2px solid var(--safety-cyan); background: #222; }

        /* QUIZ */
        #quiz-box {
            background: #000;
            border: 2px solid var(--safety-cyan);
            border-radius: 20px;
            padding: 30px;
            max-width: 90%;
        }
        .opt-btn {
            background: #111;
            border: 1px solid #444;
            color: white;
            width: 100%;
            padding: 15px;
            margin: 5px 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }
        .opt-btn:hover { border-color: var(--safety-cyan); transform: translateX(5px); }

        /* POPUP */
        #reward-toast {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--caution-yellow);
            color: #000;
            padding: 10px 30px;
            border-radius: 50px;
            font-weight: 900;
            z-index: 60;
            display: none;
            animation: slideUp 0.5s ease-out;
        }
        @keyframes slideUp { from { bottom: 50px; opacity: 0; } to { bottom: 100px; opacity: 1; } }

    </style>
</head>
<body>

<div id="game-area">
    <canvas id="gameCanvas"></canvas>

    <div class="hud-overlay">
        <div class="stat-badge">CARTEIRA: <span class="money-text">$</span><span id="cash-count">0</span></div>
        <div class="stat-badge" style="border-left-color: var(--f1-red);">META: <span id="dist-count">0</span>/1000m</div>
    </div>

    <div id="map-container">
        <div id="p-pos"></div>
    </div>

    <div id="reward-toast">MISSAO COMPLETA: +$500</div>

    <!-- START -->
    <div id="screen-start" class="screen-ui">
        <div style="font-size: 0.9rem; letter-spacing: 5px; color: var(--safety-cyan); margin-bottom: 5px;">VISTA SUPERIOR 2.0</div>
        <h1 class="title-glow">OWN THE ROAD</h1>
        <p style="color: #888; margin-bottom: 30px;">Complete o percurso, responda os desafios e compre o carro de F1!</p>
        <button class="btn-style" id="btn-play">INICIAR CORRIDA</button>
        <button class="btn-style" style="background:#333" id="btn-garage">MINHA GARAGEM</button>
    </div>

    <!-- GARAGE -->
    <div id="screen-garage" class="screen-ui hide">
        <h1 class="title-glow">GARAGEM</h1>
        <div id="garage-grid"></div>
        <button class="btn-style" id="btn-exit-garage">SAIR</button>
    </div>

    <!-- QUIZ -->
    <div id="screen-quiz" class="screen-ui hide">
        <div id="quiz-box">
            <h2 id="quiz-q" style="margin-bottom: 20px;">PERGUNTA?</h2>
            <div id="quiz-opts"></div>
        </div>
    </div>

    <!-- GAME OVER -->
    <div id="screen-over" class="screen-ui hide">
        <h1 id="over-t" class="title-glow">FIM DA LINHA</h1>
        <p id="over-res" style="margin-bottom: 30px;"></p>
        <button class="btn-style" id="btn-restart">TENTAR DE NOVO</button>
        <button class="btn-style" style="background:#333" id="btn-over-garage">GARAGEM</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // VEHICLE DATA
    const VEHICLES = [
        { id: 0, n: "Compacto", p: 0, s: 6, a: 0.12, c: "#ccc" },
        { id: 1, n: "Sedan Executivo", p: 200, s: 9, a: 0.18, c: "#336" },
        { id: 2, n: "SUV Adventure", p: 500, s: 11, a: 0.22, c: "#363" },
        { id: 3, n: "Esportivo GT", p: 1200, s: 15, a: 0.35, c: "#a33" },
        { id: 4, n: "F1 ULTIMATE", p: 3000, s: 22, a: 0.60, c: "#e10600" }
    ];

    // QUESTIONS
    const POOL = [
        { q: "Qual a distância de segurança ao ciclista?", a: "1,5 metro", o: ["0,5m", "2,0m", "5,0m"] },
        { q: "Luz amarela no semáforo significa?", a: "Atenção, pare se possível", o: ["Acelere", "Passe rápido", "Ligue o pisca"] },
        { q: "Beber e dirigir é permitido?", a: "Nunca (Lei Seca)", o: ["Só um copo", "Só se for cerveja", "Se não estiver tonto"] },
        { q: "Uso de celular dirigindo é:", a: "Infração Gravíssima", o: ["Permitido no sinal", "OK se for viva-voz", "Só para olhar GPS"] },
        { q: "O cinto de segurança é obrigatório:", a: "Para todos os ocupantes", o: ["Só no banco frente", "Só em rodovias", "Não se tiver Airbag"] },
        { q: "Velocidade máxima em via urbana sem placa?", a: "80km/h (Trânsito Rápido)", o: ["40km/h", "100km/h", "60km/h"] },
        { q: "Placa 'PARE' exige:", a: "Parada Total do veículo", o: ["Redução", "Atenção", "Olhar e seguir"] },
        { q: "Chuva forte exige:", a: "Reduzir e dobrar distância", o: ["Ligar o farol alto", "Aumentar velocidade", "Parar na faixa esquerda"] }
    ];

    // PERSISTENCE
    let game = {
        cash: parseInt(localStorage.getItem('otr_v2_cash')) || 0,
        owned: JSON.parse(localStorage.getItem('otr_v2_owned')) || [0],
        sel: parseInt(localStorage.getItem('otr_v2_sel')) || 0,
        d: 0,
        target: 10000,
        v: 0,
        active: false,
        px: 300,
        roadY: 0,
        obs: [],
        qTimer: 0,
        used: [],
        lt: 0
    };

    const keys = {};
    window.onkeydown = e => keys[e.key] = true;
    window.onkeyup = e => keys[e.key] = false;

    function refreshHUD() {
        document.getElementById('cash-count').innerText = game.cash;
        document.getElementById('dist-count').innerText = Math.floor(game.d / 10);
        const mapP = (game.d / game.target) * 290;
        document.getElementById('p-pos').style.bottom = mapP + 'px';
    }

    function sync() {
        localStorage.setItem('otr_v2_cash', game.cash);
        localStorage.setItem('otr_v2_owned', JSON.stringify(game.owned));
        localStorage.setItem('otr_v2_sel', game.sel);
    }

    function updateGarage() {
        const grid = document.getElementById('garage-grid');
        grid.innerHTML = '';
        VEHICLES.forEach(v => {
            const has = game.owned.includes(v.id);
            const isSet = game.sel === v.id;
            const item = document.createElement('div');
            item.className = `item-card ${isSet ? 'active' : ''}`;
            item.innerHTML = `
                <div style="text-align:left">
                    <div style="font-weight:900; font-size:1.1rem">${v.n}</div>
                    <div style="color:var(--caution-yellow)">${has ? 'DISPONÍVEL' : '$' + v.p}</div>
                </div>
                <button class="btn-style" style="margin:0; padding:10px 20px; font-size:0.9rem; background:${has ? (isSet ? '#444' : 'var(--safety-cyan)') : 'var(--f1-red)'}">
                    ${has ? (isSet ? 'EM USO' : 'ESCOLHER') : 'COMPRAR'}
                </button>
            `;
            item.querySelector('button').onclick = () => {
                if (!has) {
                    if (game.cash >= v.p) {
                        game.cash -= v.p;
                        game.owned.push(v.id);
                        sync();
                        updateGarage();
                        refreshHUD();
                    } else alert("SEM DINHEIRO!");
                } else {
                    game.sel = v.id;
                    sync();
                    updateGarage();
                }
            };
            grid.appendChild(item);
        });
    }

    function popQuiz() {
        if (!game.active) return;
        let pool = POOL.filter((_, i) => !game.used.includes(i));
        if (pool.length === 0) { game.used = []; pool = POOL; }
        
        const idx = POOL.indexOf(pool[Math.floor(Math.random() * pool.length)]);
        game.used.push(idx);
        const qData = POOL[idx];

        document.getElementById('quiz-q').innerText = qData.q;
        const optsGroup = document.getElementById('quiz-opts');
        optsGroup.innerHTML = '';

        [qData.a, ...qData.o].sort(() => Math.random() - 0.5).forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = opt;
            btn.onclick = () => {
                if (opt === qData.a) { game.cash += 50; sync(); refreshHUD(); }
                else game.v = 0;
                document.getElementById('screen-quiz').classList.add('hide');
                game.active = true;
                game.qTimer = 0;
            };
            optsGroup.appendChild(btn);
        });

        document.getElementById('screen-quiz').classList.remove('hide');
        game.active = false;
    }

    function setup() {
        game.d = 0;
        game.v = 0;
        game.px = canvas.width / 2;
        game.obs = [];
        game.qTimer = 0;
        for(let i=0; i<30; i++) {
            game.obs.push({
                x: 180 + Math.random() * 240,
                y: -(i * 800) - 1200,
                w: 50, h: 90
            });
        }
    }

    function loop(now) {
        if (game.active) {
            const step = (now - game.lt) / 1000;
            game.lt = now;

            const carProps = VEHICLES[game.sel];

            if (keys['w'] || keys['ArrowUp']) game.v += carProps.a;
            else if (keys['s'] || keys['ArrowDown']) game.v -= 0.5;
            else game.v *= 0.99;

            if (keys['a'] || keys['ArrowLeft']) game.px -= 6;
            if (keys['d'] || keys['ArrowRight']) game.px += 6;

            game.v = Math.max(0, Math.min(game.v, carProps.s));
            game.px = Math.max(160, Math.min(440, game.px));

            game.d += game.v;
            game.roadY = (game.roadY + game.v) % 120;

            game.qTimer += step;
            if (game.qTimer >= 12) popQuiz();

            game.obs.forEach(o => {
                o.y += game.v;
                if (Math.abs(o.x - game.px) < 45 && Math.abs(o.y - (canvas.height - 180)) < 85) {
                    game.active = false;
                    document.getElementById('over-res').innerText = "Mantenha o foco! Uma colisão pode ser evitada com atenção.";
                    document.getElementById('screen-over').classList.remove('hide');
                }
            });

            if (game.d >= game.target) {
                game.active = false;
                game.cash += 500;
                sync();
                refreshHUD();
                document.getElementById('reward-toast').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('reward-toast').style.display = 'none';
                    document.getElementById('over-t').innerText = "VITORIA!";
                    document.getElementById('over-res').innerText = "Parabéns, Capitão da Estrada! Você ganhou $500.";
                    document.getElementById('screen-over').classList.remove('hide');
                }, 2000);
            }
            refreshHUD();
        }

        // DRAW
        ctx.fillStyle = '#447a37'; ctx.fillRect(0,0,canvas.width,canvas.height); // Grass
        ctx.fillStyle = '#333'; ctx.fillRect(150, 0, 300, canvas.height); // Road
        
        ctx.fillStyle = '#fff';
        ctx.fillRect(150, 0, 8, canvas.height); ctx.fillRect(442, 0, 8, canvas.height);

        ctx.setLineDash([40, 40]); ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(300, -120 + game.roadY); ctx.lineTo(300, canvas.height + 120 + game.roadY);
        ctx.stroke(); ctx.setLineDash([]);

        // OBS
        ctx.fillStyle = '#722';
        game.obs.forEach(o => {
            ctx.beginPath(); ctx.roundRect(o.x - o.w/2, o.y, o.w, o.h, 10); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.font = '25px bold Arial'; ctx.fillText('⚠', o.x - 12, o.y + 55);
            ctx.fillStyle = '#722';
        });

        // PLAYER
        const c = VEHICLES[game.sel];
        ctx.fillStyle = c.c;
        ctx.beginPath(); ctx.roundRect(game.px - 22, canvas.height - 180, 44, 90, 8); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(game.px - 18, canvas.height - 165, 36, 25);
        ctx.fillStyle = '#000'; 
        ctx.fillRect(game.px-28, canvas.height-170, 8, 20); ctx.fillRect(game.px+20, canvas.height-170, 8, 20);
        ctx.fillRect(game.px-28, canvas.height-120, 8, 20); ctx.fillRect(game.px+20, canvas.height-120, 8, 20);

        requestAnimationFrame((t) => {
            if (!game.active && game.lt === 0) game.lt = t;
            loop(t);
        });
    }

    // BUTTONS
    document.getElementById('btn-play').onclick = () => {
        document.getElementById('screen-start').classList.add('hide'); setup();
        game.active = true; game.lt = performance.now();
    };
    document.getElementById('btn-garage').onclick = () => {
        updateGarage(); document.getElementById('screen-garage').classList.remove('hide');
    };
    document.getElementById('btn-exit-garage').onclick = () => {
        document.getElementById('screen-garage').classList.add('hide');
    };
    document.getElementById('btn-restart').onclick = () => {
        document.getElementById('screen-over').classList.add('hide'); setup();
        game.active = true; game.lt = performance.now();
    };
    document.getElementById('btn-over-garage').onclick = () => {
        document.getElementById('screen-over').classList.add('hide'); updateGarage();
        document.getElementById('screen-garage').classList.remove('hide');
    };

    function start() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        refreshHUD();
        loop(performance.now());
    }
    window.onresize = start;
    start();

</script>
</body>
</html>

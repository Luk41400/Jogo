<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Own the Road v3.4 | FINAL UPDATE</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --f1-red: #E10600;
            --safety-cyan: #00F2FF;
            --caution-yellow: #FFD700;
            --dark-bg: #030303;
            --glass: rgba(0,0,0,0.9);
            --neon: 0 0 20px rgba(0, 242, 255, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background-color: var(--dark-bg); color: white;
            font-family: 'Space Grotesk', sans-serif; height: 100vh;
            overflow: hidden; display: flex; justify-content: center; align-items: center;
        }

        #game-area {
            position: relative; width: 100vw; height: 100vh;
            max-width: 600px; max-height: 900px; background: #111;
            overflow: hidden; border: 5px solid #000;
            box-shadow: 0 0 100px rgba(0,242,255,0.1);
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* HUD */
        .hud-overlay {
            position: absolute; top: 15px; left: 15px; right: 15px;
            z-index: 10; display: flex; flex-direction: column; gap: 8px; pointer-events: none;
        }
        .badge {
            background: var(--glass); padding: 8px 12px; border-radius: 6px;
            font-weight: 700; border-left: 4px solid var(--safety-cyan); box-shadow: var(--neon);
            width: fit-content; font-size: 0.9rem;
        }
        .hp-bar { width: 100px; height: 8px; background: #333; border-radius: 4px; margin-top: 4px; overflow: hidden; }
        #hp-val { width: 100%; height: 100%; background: #0f0; transition: width 0.3s; }

        /* SPEEDO */
        #speedo {
            position: absolute; bottom: 25px; left: 15px;
            width: 100px; height: 100px; background: var(--glass);
            border: 3px solid #222; border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; box-shadow: var(--neon);
        }
        #speed-num { font-size: 1.6rem; font-weight: 900; color: var(--safety-cyan); font-family: 'Outfit'; }
        .km { font-size: 0.5rem; color: #777; font-weight: 900; }

        /* TRACK */
        #track { position: absolute; top: 130px; right: 15px; width: 8px; height: 300px; background: rgba(255,255,255,0.1); border-radius: 4px; }
        #player-point { position: absolute; left: -11px; width: 30px; height: 6px; background: var(--f1-red); border-radius: 3px; box-shadow: 0 0 8px var(--f1-red); }

        /* SCREENS */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100; text-align: center; padding: 25px;
        }
        .hide { display: none !important; }

        .btn {
            background: var(--f1-red); color: white; border: none; padding: 12px 30px;
            font-size: 1.1rem; font-weight: 900; cursor: pointer; border-radius: 4px;
            margin: 8px; transition: 0.2s; font-family: inherit;
        }
        .btn:hover { background: #ff1100; transform: scale(1.05); }

    </style>
</head>
<body>

<div id="game-area">
    <canvas id="gameCanvas"></canvas>

    <div class="hud-overlay">
        <div class="badge">SALDO: <span id="money-display" style="color:var(--caution-yellow)">$0</span></div>
        <div class="badge">DURABILIDADE <div class="hp-bar"><div id="hp-val"></div></div></div>
        <div class="badge">META: <span id="dist-display">0</span>m</div>
    </div>

    <div id="speedo"><div id="speed-num">0</div><div class="km">KM/H</div></div>
    <div id="track"><div id="player-point"></div></div>

    <!-- START -->
    <div id="scr-start" class="screen">
        <h1 style="font-size: 2.8rem; margin-bottom: 30px; color: var(--f1-red)">OWN THE ROAD v3.4</h1>
        <p style="color: #888; margin-bottom: 40px;">Agora com imagens nos carros e sistema de retorno ao menu.</p>
        <button class="btn" id="start-btn">INICIAR CORRIDA</button>
        <button class="btn" style="background:#444" id="garage-btn">GARAGEM</button>
    </div>

    <!-- GARAGE -->
    <div id="scr-garage" class="screen hide">
        <h1 style="color: var(--safety-cyan); margin-bottom: 20px;">GARAGEM</h1>
        <div id="garage-list" style="width:100%; max-height: 60vh; overflow-y:auto; margin-bottom: 20px; padding:10px;"></div>
        <button class="btn" id="hide-garage">FECHAR</button>
    </div>

    <!-- QUIZ -->
    <div id="scr-quiz" class="screen hide">
        <div style="background:#000; border: 2px solid var(--safety-cyan); padding: 30px; border-radius: 12px; width: 90%;">
            <h2 id="q-text" style="margin-bottom: 25px; font-size: 1.3rem;">Pergunta?</h2>
            <div id="q-options" style="display:flex; flex-direction:column; gap:10px;"></div>
        </div>
    </div>

    <!-- END -->
    <div id="scr-end" class="screen hide">
        <h1 id="end-title" style="font-size: 2.5rem;">FIM DE JOGO</h1>
        <p id="end-msg" style="color: #aaa; margin: 25px 0; font-size: 1.1rem;"></p>
        <button class="btn" id="rematch-btn">REPETIR</button>
        <button class="btn" style="background:#444" id="menu-btn">VOLTAR AO MENU</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // CAR ASSETS (SVGs as Data URIs)
    const CAR_IMAGES = {
        hatch: `data:image/svg+xml;base64,${btoa('<svg width="50" height="90" viewBox="0 0 50 90" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="10" width="40" height="70" rx="10" fill="gray"/><rect x="8" y="25" width="34" height="15" rx="2" fill="lightblue" opacity="0.6"/><rect x="10" y="55" width="30" height="15" rx="5" fill="black"/><rect x="0" y="20" width="5" height="10" rx="2" fill="gray"/><rect x="45" y="20" width="5" height="10" rx="2" fill="gray"/></svg>')}`,
        sedan: `data:image/svg+xml;base64,${btoa('<svg width="50" height="90" viewBox="0 0 50 90" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="5" width="40" height="80" rx="8" fill="blue"/><rect x="8" y="25" width="34" height="20" rx="3" fill="skyblue" opacity="0.5"/><rect x="10" y="65" width="30" height="10" rx="2" fill="skyblue" opacity="0.5"/><rect x="2" y="20" width="4" height="12" fill="blue"/><rect x="44" y="20" width="4" height="12" fill="blue"/></svg>')}`,
        suv: `data:image/svg+xml;base64,${btoa('<svg width="60" height="100" viewBox="0 0 60 100" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="5" width="50" height="90" rx="5" fill="darkgreen"/><rect x="10" y="15" width="40" height="25" rx="2" fill="white" opacity="0.3"/><rect x="15" y="50" width="30" height="5" fill="black" opacity="0.4"/><rect x="0" y="30" width="8" height="15" fill="darkgreen"/></svg>')}`,
        sport: `data:image/svg+xml;base64,${btoa('<svg width="50" height="100" viewBox="0 0 50 100" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="10" width="40" height="80" rx="20" fill="orange"/><path d="M5 80 L45 80 L45 95 L5 95 Z" fill="black"/><rect x="12" y="30" width="26" height="20" rx="10" fill="black" opacity="0.7"/></svg>')}`,
        f1: `data:image/svg+xml;base64,${btoa('<svg width="60" height="100" viewBox="0 0 60 100" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="10" width="20" height="50" rx="5" fill="red"/><rect x="10" y="45" width="40" height="40" rx="8" fill="red"/><rect x="0" y="20" width="60" height="12" fill="black"/><rect x="5" y="85" width="50" height="12" fill="black"/><rect x="0" y="25" width="12" height="20" fill="black"/><rect x="48" y="25" width="12" height="20" fill="black"/></svg>')}`
    };

    const IMGS = {};
    for(let k in CAR_IMAGES) {
        IMGS[k] = new Image();
        IMGS[k].src = CAR_IMAGES[k];
    }

    // VEHICLES TABLE
    const VEHICLES = [
        { id: 0, n: "Compacto", p: 0, s: 7, a: 0.12, t: 'hatch' },
        { id: 1, n: "Sedan Premium", p: 500, s: 10, a: 0.20, t: 'sedan' },
        { id: 2, n: "SUV de Luxo", p: 1200, s: 13, a: 0.25, t: 'suv' },
        { id: 3, n: "Super Carro", p: 2500, s: 17, a: 0.40, t: 'sport' },
        { id: 4, n: "MONOPOSTO F1", p: 5000, s: 25, a: 0.70, t: 'f1' }
    ];

    const POOL = [
        { q: "Qual a distância mínima de segurança ao ultrapassar um ciclista?", a: "1,5 metro", o: ["0,5m", "1,0m", "2 metros"] },
        { q: "O sinal de trânsito amarelo indica que o motorista deve:", a: "Parar, se puder fazê-lo com segurança", o: ["Acelerar", "Ligar o alerta", "Buzinar e passar"] },
        { q: "A velocidade máxima em vias de trânsito rápido sem placas é:", a: "80 km/h", o: ["60 km/h", "100 km/h", "40 km/h"] },
        { q: "Bebida alcoólica e direção combinam com:", a: "Absolutamente nada (Tolerância Zero)", o: ["Uma taça pequena", "Caminho de volta curto", "Apenas em feriados"] }
    ];

    let game = {
        money: parseInt(localStorage.getItem('otr_final_m')) || 0,
        owned: JSON.parse(localStorage.getItem('otr_final_o')) || [0],
        sel: parseInt(localStorage.getItem('otr_final_s')) || 0,
        hp: 100, dist: 0, v: 0, active: false, px: 300, offset: 0,
        obs: [], qTimer: 0, lastTime: 0
    };

    const keys = {};
    window.onkeydown = e => keys[e.key] = true;
    window.onkeyup = e => keys[e.key] = false;

    function sync() {
        localStorage.setItem('otr_final_m', game.money);
        localStorage.setItem('otr_final_o', JSON.stringify(game.owned));
        localStorage.setItem('otr_final_s', game.sel);
        document.getElementById('money-display').innerText = '$' + game.money;
    }

    function spawn() {
        game.hp = 100; game.dist = 0; game.v = 0; game.px = 300; game.qTimer = 0;
        game.obs = [];
        for(let i=0; i<45; i++) {
            game.obs.push({
                x: 180 + Math.random() * 240,
                y: -(i * 700) - 1000,
                t: ['sedan', 'hatch'][i%2]
            });
        }
    }

    function popQuiz() {
        const qData = POOL[Math.floor(Math.random() * POOL.length)];
        document.getElementById('q-text').innerText = qData.q;
        const opts = document.getElementById('q-options');
        opts.innerHTML = '';
        [qData.a, ...qData.o].sort(() => Math.random() - 0.5).forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn'; btn.innerText = opt;
            btn.onclick = () => {
                if(opt === qData.a) { game.money += 100; sync(); }
                else { game.hp -= 30; alert("Incorreto! -30% Durabilidade."); }
                document.getElementById('scr-quiz').classList.add('hide');
                game.active = true; game.qTimer = 0;
            };
            opts.appendChild(btn);
        });
        document.getElementById('scr-quiz').classList.remove('hide');
        game.active = false;
    }

    function loop(now) {
        if(game.active) {
            const dt = (now - game.lastTime) / 1000;
            game.lastTime = now;
            const car = VEHICLES[game.sel];

            if(keys['w'] || keys['ArrowUp']) game.v += car.a;
            else if(keys['s'] || keys['ArrowDown']) game.v -= car.a;
            else game.v *= 0.98;

            if(keys['a'] || keys['ArrowLeft']) game.px -= 6;
            if(keys['d'] || keys['ArrowRight']) game.px += 6;

            game.v = Math.max(-car.s/2, Math.min(game.v, car.s));
            game.px = Math.max(160, Math.min(440, game.px));
            game.dist += game.v;
            game.offset = (game.offset + game.v) % 120;

            game.qTimer += dt;
            if(game.qTimer >= 10) popQuiz();

            game.obs.forEach(o => {
                o.y += game.v;
                if(Math.abs(o.x - game.px) < 45 && Math.abs(o.y - (canvas.height - 180)) < 80) {
                    game.hp -= 0.6; game.v *= 0.95;
                }
            });

            if(game.hp <= 0) {
                game.active = false;
                document.getElementById('end-title').innerText = "VÉICULO DANIFICADO";
                document.getElementById('end-msg').innerText = "Seja mais cuidadoso no trânsito urbano!";
                document.getElementById('scr-end').classList.remove('hide');
            }

            if(game.dist >= 10000) {
                game.active = false; game.money += 500; sync();
                document.getElementById('end-title').innerText = "MISSÃO CUMPRIDA";
                document.getElementById('end-msg').innerText = "Você chegou com segurança! Recompensa: $500";
                document.getElementById('scr-end').classList.remove('hide');
            }

            // HUD
            document.getElementById('hp-val').style.width = game.hp + '%';
            document.getElementById('dist-display').innerText = Math.floor(game.dist / 10);
            document.getElementById('speed-num').innerText = Math.abs(Math.floor(game.v * 12));
            document.getElementById('player-point').style.bottom = Math.min(295, (game.dist/10000)*295) + 'px';
        }

        // DRAW
        ctx.fillStyle = '#1b4d0e'; ctx.fillRect(0,0,canvas.width,canvas.height); // Grass
        ctx.fillStyle = '#222'; ctx.fillRect(150, 0, 300, canvas.height); // Road
        ctx.fillStyle = '#fff'; ctx.fillRect(150,0,6,canvas.height); ctx.fillRect(444,0,6,canvas.height);
        
        ctx.setLineDash([40,40]); ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=4;
        ctx.beginPath(); ctx.moveTo(300, -120 + game.offset); ctx.lineTo(300, canvas.height+120+game.offset);
        ctx.stroke(); ctx.setLineDash([]);

        // DRAW ASSET CARS
        game.obs.forEach(o => {
            const img = IMGS[o.t];
            ctx.drawImage(img, o.x - 22, o.y, 44, 90);
        });

        const pImg = IMGS[VEHICLES[game.sel].t];
        ctx.drawImage(pImg, game.px - 22, canvas.height - 180, 44, 90);

        requestAnimationFrame(loop);
    }

    // INTERFACE
    document.getElementById('start-btn').onclick = () => {
        document.getElementById('scr-start').classList.add('hide'); spawn();
        game.active = true; game.lastTime = performance.now();
    };
    document.getElementById('garage-btn').onclick = () => {
        const list = document.getElementById('garage-list'); list.innerHTML = '';
        VEHICLES.forEach(v => {
            const has = game.owned.includes(v.id); const isS = game.sel === v.id;
            const card = document.createElement('div');
            card.style = "background:#111; padding:15px; border-radius:10px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; border:1px solid "+(isS?'var(--safety-cyan)':'#333');
            card.innerHTML = `<div><b>${v.n}</b><br><small style="color:var(--caution-yellow)">${has?'COLECIONADO':'$'+v.p}</small></div><button class="btn" style="margin:0; padding:6px 12px; font-size:0.8rem;">${has?(isS?'EQUIPADO':'EQUIPAR'):'COMPRAR'}</button>`;
            card.querySelector('button').onclick = () => {
                if(!has && game.money >= v.p) { game.money -= v.p; game.owned.push(v.id); sync(); document.getElementById('garage-btn').click(); }
                else if(has) { game.sel = v.id; sync(); document.getElementById('garage-btn').click(); }
            };
            list.appendChild(card);
        });
        document.getElementById('scr-garage').classList.remove('hide');
    };
    document.getElementById('hide-garage').onclick = () => document.getElementById('scr-garage').classList.add('hide');
    document.getElementById('rematch-btn').onclick = () => {
        document.getElementById('scr-end').classList.add('hide'); spawn();
        game.active = true; game.lastTime = performance.now();
    };
    document.getElementById('menu-btn').onclick = () => {
        document.getElementById('scr-end').classList.add('hide');
        document.getElementById('scr-start').classList.remove('hide');
    };

    function start() {
        canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
        sync(); loop(performance.now());
    }
    window.onresize = start;
    start();

</script>
</body>
</html>

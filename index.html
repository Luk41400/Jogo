<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECURITY ON THE ROAD | GLOBAL VERSION</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@900&family=Space+Grotesk:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --f1-red: #E10600;
            --safety-cyan: #00F2FF;
            --caution-yellow: #FFD700;
            --nitro-blue: #00a8ff;
            --dark-bg: #030303;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: var(--dark-bg);
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-area {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 600px;
            max-height: 900px;
            background: #111;
            border: 4px solid #333;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* HUD */
        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stat-badge {
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 15px;
            border-radius: 8px;
            border-left: 4px solid var(--safety-cyan);
            width: fit-content;
        }

        .bar-cont {
            width: 100px;
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 5px;
        }

        #hp-bar {
            width: 100%;
            height: 100%;
            background: #0f0;
            transition: 0.3s;
        }

        #nitro-bar {
            width: 100%;
            height: 100%;
            background: var(--nitro-blue);
            transition: 0.1s linear;
        }

        .ctrl-hud {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            /* Ensure it's above everything including screens */
            display: flex;
            gap: 10px;
        }

        .btn-icon {
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border: 1px solid #555;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        /* VOLUME SLIDER SYSTEM */
        .vol-wrapper {
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #444;
            height: 44px;
            width: 44px;
            /* Start as circle */
            border-radius: 22px;
            display: flex;
            align-items: center;
            overflow: hidden;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            cursor: pointer;
        }

        .vol-wrapper.active {
            width: 160px;
            /* Expand to show slider */
            padding-right: 15px;
            border-color: var(--safety-cyan);
            cursor: default;
            /* Don't show pointer for the whole container when open */
        }

        .vol-icon {
            min-width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            z-index: 2;
        }

        .vol-slider {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: #333;
            border-radius: 2px;
            outline: none;
            opacity: 0;
            transition: opacity 0.3s;
            cursor: pointer;
        }

        .vol-wrapper.active .vol-slider {
            opacity: 1;
        }

        .vol-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--safety-cyan);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px var(--safety-cyan);
        }

        .vol-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--safety-cyan);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px var(--safety-cyan);
            border: none;
        }

        #speedo {
            position: absolute;
            bottom: 25px;
            left: 20px;
            width: 100px;
            height: 100px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 50%;
            border: 2px solid #555;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        #sp-num {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--safety-cyan);
            font-family: 'Outfit';
        }

        #track-map {
            position: absolute;
            top: 180px;
            right: 20px;
            width: 10px;
            height: 300px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
        }

        #p-marker {
            position: absolute;
            left: -10px;
            width: 30px;
            height: 6px;
            background: var(--f1-red);
            border-radius: 3px;
            box-shadow: 0 0 10px var(--f1-red);
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            backdrop-filter: blur(4px);
        }

        #scr-quiz {
            background: rgba(0, 0, 0, 0.75);
        }

        .hide {
            display: none !important;
        }

        .btn {
            background: var(--f1-red);
            color: white;
            border: none;
            padding: 12px 25px;
            font-weight: 900;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 5px;
            margin: 8px;
        }

        .btn:hover {
            background: #ff0000;
        }

        .disclaimer {
            position: absolute;
            bottom: 15px;
            right: 15px;
            font-size: 0.65rem;
            color: rgba(255,255,255,0.2);
            text-align: right;
            max-width: 200px;
            line-height: 1.2;
            pointer-events: none;
        }

        /* TUTORIAL (CLASSIC DESIGN) */
        .tut-box {
            text-align: left;
            background: #000;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #444;
            margin: 20px 0;
            max-width: 90%;
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .tut-box b {
            color: var(--safety-cyan);
        }

        #track-map {
            position: absolute;
            top: 180px;
            right: 20px;
            width: 10px;
            height: 300px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
        }

        @keyframes fadeOut {
            0% {
                opacity: 0;
                transform: translate(-50%, 20px);
            }

            10% {
                opacity: 1;
                transform: translate(-50%, 0);
            }

            80% {
                opacity: 1;
                transform: translate(-50%, 0);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -20px);
            }
        }
    </style>
</head>

<body>

    <div id="game-area">
        <canvas id="gameCanvas"></canvas>

        <div class="hud">

                    <div id="hp-bar"></div>

                </div>
            </div>

            <button class="btn" id="start-btn">START RACE</button>
            <button class="btn" style="background:#444" id="tut-btn">HOW TO PLAY</button>
            <button class="btn" style="background:#444" id="garage-btn">GARAGE</button>
            <button class="btn" style="background:#2c3e50" id="shop-btn">UPGRADE SHOP</button>

        <!-- GARAGE -->
        <div id="scr-garage" class="screen hide">
            <h1 id="gar-title" style="color:var(--safety-cyan)">GARAGE</h1>
            <div class="stat-badge" style="margin:10px 0; pointer-events:auto; border-left-color:var(--caution-yellow)">
                YOUR BALANCE: <span id="m-garage" style="color:var(--caution-yellow)">$0</span>
            </div>
            <div id="car-list" style="width:100%; max-height:55vh; overflow-y:auto; margin:15px 0; padding-right:10px;"></div>
            <button class="btn" id="exit-garage">BACK</button>

        <!-- SHOP -->
        <div id="scr-shop" class="screen hide">
            <h1 id="shop-title" style="color:var(--caution-yellow)">OFICINA</h1>

            <button class="btn" id="exit-shop">BACK</button>
        </div>

        <!-- QUIZ -->

                style="background:#111; border:2px solid var(--safety-cyan); padding:30px; border-radius:15px; width:90%; text-align:center; display:flex; flex-direction:column; align-items:center;">

                <div id="q-box" style="display:flex; flex-direction:column; gap:10px; width:100%;"></div>

        </div>

            <p id="res-msg" style="margin:20px 0; color:#888;"></p>
            <button class="btn" id="retry-btn">RETRY</button>

            <button class="btn" id="restart-btn">RESTART</button>
            <button class="btn" id="back-menu" style="background:#444">MAIN MENU</button>
        </div>

        function drawPost(ctx, y, color) {
            ctx.save(); ctx.translate(300, y);
            // Estrutura Superior COLOSSAL
            ctx.fillStyle = '#000'; ctx.fillRect(-250, -220, 500, 35); // Viga superior reforÃƒÆ’Ã‚Â§ada
            ctx.fillStyle = '#111'; ctx.fillRect(-270, -220, 50, 600); ctx.fillRect(220, -220, 50, 600); // Postes laterais gigantes

            ctx.fillStyle = '#050505'; ctx.beginPath(); ctx.roundRect(-60, -280, 120, 240, 15); ctx.fill();
            ctx.strokeStyle = '#333'; ctx.lineWidth = 6; ctx.stroke();
            
            // Luzes ENORMES com efeitos de brilho (HologrÃƒÆ’Ã‚Â¡ficas)
            const sz = 30;
            const drawLight = (ly, lc, lcolor, isLit) => {
                ctx.fillStyle = isLit ? lcolor : "#111";
                ctx.beginPath(); ctx.arc(0, ly, sz, 0, Math.PI*2); ctx.fill();
                if(isLit) {
                    ctx.shadowBlur = 50; ctx.shadowColor = lcolor;
                    ctx.beginPath(); ctx.arc(0, ly, sz, 0, Math.PI*2); ctx.fill();
                    ctx.shadowBlur = 0;
                }
            };

            drawLight(-230, 'red', '#ff1a1a', color === 'red');
            drawLight(-160, 'yellow', '#ffff00', color === 'yellow');
            drawLight(-90, 'green', '#00ff00', color === 'green');
            ctx.restore();
        }

        function popQuiz(type) {
            const scr = document.getElementById('scr-quiz');
            if (scr && !scr.classList.contains('hide')) return;
            game.qActive = true;
            
            // FILTRA PERGUNTA PELA COR OU GERAL

                if (answered) return;

                setTimeout(() => { 
                    scr.classList.add('hide');

                    game.lt = performance.now();

            // Farol Inicial (Amarelo enquanto responde)

            document.getElementById('t-yellow').style.boxShadow = '0 0 15px #ff0';
            document.getElementById('t-green').style.background = '#020';

            qInterval = setInterval(() => { 
                tl--; 
                timerTxt.innerText = tl; 
                if (tl <= 0) endQ(false); 
            }, 1000);

            [q.a, ...q.o].sort(() => Math.random() - 0.5).forEach(opt => {
                const b = document.createElement('button'); 
                b.className = 'btn'; 
                b.innerText = opt; 
                b.style.width = "100%";

                    e.preventDefault();
                    if (opt === q.a) b.style.background = "#27ae60";
                    else b.style.background = "#c0392b";
                    endQ(opt === q.a);
                };
                qBox.appendChild(b);
            });
            scr.classList.remove('hide');
    }

        function init() {
            const level = game.upgs[game.sel];
            const c = { ...CARS[game.sel] };
            // Aumenta stats com base no nÃƒÆ’Ã‚Â­vel
            c.s = c.s * (1 + (level - 1) * 0.15);
            c.a = c.a * (1 + (level - 1) * 0.2);

            game.hp = 100; game.d = 0; game.v = 0; game.px = 300; game.qClock = 0; game.started = false; game.obs = []; game.nitro = 100; game.nCD = 0; game.qActive = false;

            game.roadEv = { active: false, color: '', clock: 0, next: 8, duration: 6, y: -2000, objDelay: 0 };
            nextObsY = -800;

                game.obs.push({ x: 180 + Math.random() * 240, y: nextObsY, c: '#444', t: 'sedan', sp: 1.5 });

        function loop(now) {
            if (game.act && !game.paused) {
                const dt = (now - game.lt) / 1000; game.lt = now;
                const level = game.upgs[game.sel];
                const c = { ...CARS[game.sel] };
                c.s = c.s * (1 + (level - 1) * 0.15);
                c.a = c.a * (1 + (level - 1) * 0.2);
                
                if (!game.qActive) {
                    if (keys['w'] || keys['ArrowUp']) { game.v += c.a; game.started = true; }
                    else if (keys['s'] || keys['ArrowDown']) game.v -= c.a;
                    else game.v *= 0.98;

                    if (keys['a'] || keys['ArrowLeft']) game.px -= 6;
                    if (keys['d'] || keys['ArrowRight']) game.px += 6;
                } else {
                    game.v *= 0.90; // Stop car relative to dt but 0.90 per frame for now is ok
                }

                if (keys[' '] && game.started && game.nitro >= 5 && game.nCD <= 0 && !game.qActive) { game.isNitro = true; game.nitro -= 1; game.v += 0.5; if (game.nitro <= 0) game.nCD = 10; }
                else { game.isNitro = false; if (game.nCD > 0) { game.nCD -= dt; game.nitro = Math.min(100, game.nitro + 12 * dt); } else if (game.nitro < 100) game.nitro += 6 * dt; }

                game.v = Math.max(-c.s, Math.min(game.v, game.isNitro ? c.s * 1.5 : c.s));
                game.px = Math.max(160, Math.min(440, game.px));
                
                if (game.d + game.v <= -1000) {
                    game.v = 0;
                    game.d = -1000;
                } else {
                    game.d += game.v; 
                }
                game.offset = (game.offset + game.v) % 120;

                if (game.started) {
                    game.qClock += dt; 
                    
                    // LÃƒÆ’Ã¢â‚¬Å“GICA DO FAROL DE RUA (3s DE ANTECIPAÃƒÆ’Ã¢â‚¬Â¡ÃƒÆ’Ã†â€™O) - DESATIVADO A PEDIDO
                    game.roadEv.clock += dt;
                    if (false && !game.roadEv.active && game.roadEv.clock >= game.roadEv.next) {
                        game.roadEv.active = true;
                        game.roadEv.clock = 0;
                        game.roadEv.y = -2000; 
                        game.roadEv.objDelay = 3.0; // 3 SEG DE ESPERA PARA O FAROL FÃƒÆ’Ã‚ÂSICO
                        game.roadEv.triggered = false; 
                        const rnd = Math.random();
                        game.roadEv.color = rnd < 0.6 ? 'red' : (rnd < 0.8 ? 'yellow' : 'green');
                        
                        showPopup(t("trafficPop"), "white");

                        // LANÃƒÆ’Ã¢â‚¬Â¡A A PERGUNTA SINCRONIZADA EM TODAS AS CORES
                        setTimeout(() => {
                            if (game.roadEv.active) popQuiz(game.roadEv.color);
                        }, 1200); // 1.2 segundos depois da mensagem
                    }

                    if (game.roadEv.active) {
                        if (game.roadEv.objDelay > 0) {
                            game.roadEv.objDelay -= dt;
                        } else {
                            game.roadEv.y += game.v; 
                        }
                        
                        if (game.roadEv.clock >= game.roadEv.duration || game.roadEv.y > canvas.height + 600) {
                            game.roadEv.active = false;
                            game.roadEv.clock = 0;
                        } else if (game.roadEv.color === 'red' && game.v > 3 && game.roadEv.y > 200 && game.roadEv.y < 800) {
                            game.hp -= 1.0; // PuniÃƒÆ’Ã‚Â§ÃƒÆ’Ã‚Â£o se furar o farol vermelho
                        }
                    }
                    
                    const diffScale = 1 + (game.d / game.goal) * 2.5;
                    game.obs.forEach(o => { 
                        o.y += game.v + (game.qActive ? 0 : (o.sp * diffScale)); 
                        // ColisÃƒÆ’Ã‚Â£o ajustada para ignorar quando parado no farol
                        if (game.v > 1 && Math.abs(o.x - game.px) < 40 && Math.abs(o.y - (canvas.height - 180)) < 75) { 
                            game.hp -= 0.8; game.v *= 0.85; 
                        } 
                        if (o.y > canvas.height + 300) { 
                            let topY = Math.min(-300, game.roadEv.active ? game.roadEv.y : 0);
                            game.obs.forEach(ext => { if(ext.y < topY) topY = ext.y; });
                            o.y = topY - (800 + Math.random() * 400); 
                            o.x = 180 + Math.random() * 240; 
                        } 
                    });
                }
                if (game.hp <= 0) { 
                    game.act = false; 
                    document.getElementById('scr-quiz').classList.add('hide'); // SAFETY
                    document.getElementById('res-title').innerText = t("failed"); 
                    document.getElementById('scr-res').classList.remove('hide'); 
                }
                if (game.d >= game.goal) { 
                    game.act = false; 
                    game.m += 500; 
                    save(); 
                    document.getElementById('scr-quiz').classList.add('hide'); // SAFETY
                    document.getElementById('res-title').innerText = t("victory"); 
                    document.getElementById('scr-res').classList.remove('hide'); 
                }
                syncHUD();
            } else { game.lt = now; }

            ctx.fillStyle = '#1b4d0e'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#222'; ctx.fillRect(150, 0, 300, canvas.height);
            ctx.setLineDash([40, 40]); ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.beginPath(); ctx.moveTo(300, -100 + game.offset); ctx.lineTo(300, canvas.height + 100 + game.offset); ctx.stroke();

            game.obs.forEach(o => drawV(ctx, o.x, o.y, o.c, o.t, false));
            if (game.roadEv.active && game.roadEv.objDelay <= 0) drawPost(ctx, game.roadEv.y, game.roadEv.color);
            drawV(ctx, game.px, canvas.height - 180, CARS[game.sel].c, CARS[game.sel].t, true);
            requestAnimationFrame(loop);
        }

        document.getElementById('start-btn').onclick = () => {
            audio.src = PLAYLIST[cTrack].src;
            audio.play().catch(e => console.log("User must interact first"));
            document.getElementById('scr-menu').classList.add('hide');
            init(); game.act = true; game.lt = performance.now();
        };

        // SELETOR DE NITRO
        document.querySelectorAll('.n-sel').forEach(el => {
            el.onclick = () => {
                document.querySelectorAll('.n-sel').forEach(b => b.style.borderColor = 'transparent');
                el.style.borderColor = 'white';
                game.nColor = el.getAttribute('data-n');
                save();
            };
            if (el.getAttribute('data-n') === game.nColor) el.style.borderColor = 'white';
        });

        document.getElementById('tut-btn').onclick = () => document.getElementById('scr-tut').classList.remove('hide');
        document.getElementById('exit-tut').onclick = () => document.getElementById('scr-tut').classList.add('hide');
        document.getElementById('garage-btn').onclick = () => {
            const list = document.getElementById('car-list'); list.innerHTML = '';
            CARS.forEach((v, index) => {
                const has = game.o.includes(v.id); const sel = game.sel === v.id; const unlock = index === 0 || game.o.includes(CARS[index - 1].id);
                const card = document.createElement('div'); card.style = "background:#000; padding:12px; margin-bottom:8px; border-radius:8px; display:flex; justify-content:space-between; align-items:center; border:1px solid " + (sel ? 'var(--safety-cyan)' : '#333');
                card.innerHTML = `<div><b>${v.n}</b><br><small>${has ? t('owned') : '$' + v.p}</small></div><button class="btn" style="margin:0; padding:6px 12px; font-size:0.8rem; ${(!has && !unlock) ? 'opacity:0.5;' : ''}">${has ? (sel ? t('equip') : t('select')) : (unlock ? t('buy') : t('locked'))}</button>`;
                if (has || unlock) card.querySelector('button').onclick = () => { if (!has && game.m >= v.p) { game.m -= v.p; game.o.push(v.id); save(); document.getElementById('garage-btn').click(); } else if (has) { game.sel = v.id; save(); document.getElementById('garage-btn').click(); } };
                list.appendChild(card);
            });
            document.getElementById('scr-garage').classList.remove('hide');
        };
        document.getElementById('exit-garage').onclick = () => document.getElementById('scr-garage').classList.add('hide');

        document.getElementById('shop-btn').onclick = () => {
            const list = document.getElementById('upgrade-list'); list.innerHTML = '';
            CARS.forEach((v, index) => {
                const has = game.o.includes(v.id);
                const lvl = game.upgs[v.id];
                const isMax = lvl >= v.maxLvl;
                const cost = lvl * 300 + (v.p * 0.5);
                
                const card = document.createElement('div'); 
                card.style = `background:#000; padding:12px; margin-bottom:8px; border-radius:8px; display:flex; justify-content:space-between; align-items:center; border:1px solid #333; opacity:${has ? 1 : 0.4};`;
                card.innerHTML = `<div><b>${v.n}</b><br><small>${t('lvl')}: ${lvl}/${v.maxLvl}</small></div>
                                <button class="btn" style="margin:0; padding:6px 12px; font-size:0.8rem;" ${(!has || isMax) ? 'disabled' : ''}>
                                    ${isMax ? t('max') : (has ? t('upg') + ' $' + cost : t('locked'))}
                                </button>`;
                
                if (has && !isMax) card.querySelector('button').onclick = () => {
                    if (game.m >= cost) {
                        game.m -= cost;
                        game.upgs[v.id]++;
                        save();
                        document.getElementById('shop-btn').click();
                    }
                };
                list.appendChild(card);
            });
            document.getElementById('scr-shop').classList.remove('hide');
        };
        document.getElementById('exit-shop').onclick = () => document.getElementById('scr-shop').classList.add('hide');

        document.getElementById('pause-icon').onclick = () => { game.paused = true; document.getElementById('scr-pause').classList.remove('hide'); };
        document.getElementById('resume-btn').onclick = () => { game.paused = false; document.getElementById('scr-pause').classList.add('hide'); };
        document.getElementById('restart-btn').onclick = () => { game.paused = false; document.getElementById('scr-pause').classList.add('hide'); init(); };
        document.getElementById('back-menu').onclick = () => { game.act = false; game.paused = false; document.getElementById('scr-pause').classList.add('hide'); document.getElementById('scr-menu').classList.remove('hide'); };
        document.getElementById('res-menu').onclick = () => { game.act = false; document.getElementById('scr-res').classList.add('hide'); document.getElementById('scr-menu').classList.remove('hide'); };
        document.getElementById('retry-btn').onclick = () => { document.getElementById('scr-res').classList.add('hide'); init(); game.act = true; game.lt = performance.now(); };

        document.getElementById('admin-icon').onclick = () => {
            const p = prompt("ADMIN PASSWORD:");
            if (p === "1977") {
                game.isAdmin = true;
                game.m = 100000;
                document.getElementById('admin-icon').classList.add('hide');
                document.getElementById('exit-admin-btn').classList.remove('hide');
                showPopup("ADMIN MODE ACTIVATED", "var(--safety-cyan)");
                save(); syncHUD(); 
            } else if (p !== null && p !== "") {
                showPopup("DENIED", "red");
            }
        };

        document.getElementById('exit-admin-btn').onclick = () => {
            game.isAdmin = false;
            game.m = 500;
            document.getElementById('exit-admin-btn').classList.add('hide');
            document.getElementById('admin-icon').classList.remove('hide');
            showPopup("ADMIN MODE DEACTIVATED", "white");
            save(); syncHUD();
        };

        function boot() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            syncHUD();
            applyLang();
            loop(performance.now());
        }
        window.onresize = boot; boot();

    </script>
</body>

</html>

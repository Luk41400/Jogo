<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Own the Road v3.2 | ATUALIZAÇÃO RECENTE</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --f1-red: #E10600;
            --safety-cyan: #00F2FF;
            --caution-yellow: #FFD700;
            --dark-bg: #050505;
            --neon: 0 0 20px rgba(0, 242, 255, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-area {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 600px;
            max-height: 900px;
            background: #111;
            overflow: hidden;
            border: 5px solid #000;
            box-shadow: 0 0 100px rgba(0,242,255,0.2);
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* HUD */
        .hud-overlay {
            position: absolute;
            top: 20px; left: 20px; right: 20px;
            z-index: 10; display: flex; flex-direction: column; gap: 8px; pointer-events: none;
        }

        .stat-badge {
            background: rgba(0,0,0,0.8);
            padding: 10px 15px; border-radius: 8px; font-weight: 700;
            border-left: 4px solid var(--safety-cyan);
            box-shadow: var(--neon);
            width: fit-content;
        }

        .durability-bar {
            width: 100px; height: 8px; background: #333; border-radius: 4px; margin-top: 5px; overflow: hidden;
        }
        #hp-fill { width: 100%; height: 100%; background: #0f0; transition: width 0.3s; }

        /* SPEEDOMETER */
        #speed-gauge {
            position: absolute; bottom: 30px; left: 20px;
            width: 110px; height: 110px;
            background: rgba(0,0,0,0.8);
            border: 3px solid #333; border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; box-shadow: var(--neon);
        }
        #speed-num { font-size: 1.8rem; font-weight: 900; color: var(--safety-cyan); font-family: 'Outfit'; }
        .unit { font-size: 0.6rem; color: #888; }

        /* MINI MAP */
        #track-map {
            position: absolute; top: 150px; right: 20px;
            width: 10px; height: 300px;
            background: rgba(255,255,255,0.1); border-radius: 5px;
        }
        #p-marker {
            position: absolute; left: -10px; width: 30px; height: 6px; 
            background: var(--f1-red); border-radius: 3px; box-shadow: 0 0 10px var(--f1-red);
        }

        /* SCREENS */
        .ui-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; text-align: center; padding: 20px;
        }

        .hide { display: none !important; }

        .btn-action {
            background: var(--f1-red); color: white; border: none; padding: 15px 40px;
            font-size: 1.2rem; font-weight: 900; cursor: pointer; border-radius: 4px;
            margin: 10px; transition: 0.2s;
        }
        .btn-action:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(225,6,0,0.4); }

        /* UPDATE BANNER */
        #update-banner {
            position: absolute; top: 0; left: 0; width: 100%; background: var(--safety-cyan);
            color: #000; font-weight: 900; padding: 5px; font-size: 0.7rem; z-index: 200;
            text-transform: uppercase; letter-spacing: 2px;
        }

    </style>
</head>
<body>

<div id="game-area">
    <div id="update-banner">ESTA É A VERSÃO 3.2 ATUALIZADA - REVEJA SEU CACHE (CTRL+F5)</div>
    <canvas id="gameCanvas"></canvas>

    <div class="hud-overlay">
        <div class="stat-badge">SALDO: <span id="cash-txt" style="color:var(--caution-yellow)">$0</span></div>
        <div class="stat-badge">DURABILIDADE
            <div class="durability-bar"><div id="hp-fill"></div></div>
        </div>
        <div class="stat-badge">META: <span id="dist-txt">0</span>m</div>
    </div>

    <div id="speed-gauge">
        <div id="speed-num">0</div>
        <div class="unit">KM/H</div>
    </div>

    <div id="track-map"><div id="p-marker"></div></div>

    <!-- SCREENS -->
    <div id="screen-main" class="ui-screen">
        <h1 style="font-size: 3rem; margin-bottom: 20px; color: var(--f1-red)">OWN THE ROAD 3.2</h1>
        <p style="color: #888; margin-bottom: 30px;">Top-Down atualizado: Ré, Velocímetro e Durabilidade.</p>
        <button class="btn-action" id="start-race">CORRER AGORA</button>
        <button class="btn-action" style="background:#444" id="open-shop">GARAGEM</button>
    </div>

    <div id="screen-garage" class="ui-screen hide">
        <h1 style="color: var(--safety-cyan)">GARAGEM</h1>
        <div id="shop-list" style="width:100%; max-height: 60vh; overflow-y:auto; margin: 20px 0;"></div>
        <button class="btn-action" id="back-home">VOLTAR</button>
    </div>

    <div id="screen-quiz" class="ui-screen hide">
        <div style="background:#111; border: 2px solid var(--safety-cyan); padding: 30px; border-radius: 15px; width: 90%;">
            <h2 id="q-text" style="margin-bottom: 20px;">Pergunta?</h2>
            <div id="q-options"></div>
        </div>
    </div>

    <div id="screen-end" class="ui-screen hide">
        <h1 id="end-title">FIM DE JOGO</h1>
        <p id="end-desc" style="margin: 20px 0; color: #aaa;"></p>
        <button class="btn-action" id="play-again">REPETIR</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // CAR DATA
    const CARS = [
        { id: 0, n: "Compacto", p: 0, s: 6, a: 0.1, c: "#999", type: 'hatch' },
        { id: 1, n: "Sedan Premium", p: 300, s: 9, a: 0.15, c: "#44a", type: 'sedan' },
        { id: 2, n: "SUV de Luxo", p: 700, s: 12, a: 0.2, c: "#262", type: 'suv' },
        { id: 3, n: "Super Carro", p: 1500, s: 16, a: 0.3, c: "#fa0", type: 'sport' },
        { id: 4, n: "F1 MONOPOSTO", p: 4000, s: 23, a: 0.6, c: "#e10600", type: 'f1' }
    ];

    const QUIZ = [
        { q: "Qual a distância de segurança ao ciclista?", a: "1,5 metro", o: ["0,5m", "2,0m", "Deixar passar"] },
        { q: "O farol baixo em rodovias é:", a: "Obrigatório", o: ["Opcional dia", "Proibido", "Só à noite"] },
        { q: "Luz amarela serve para:", a: "Parar se possível", o: ["Acelerar", "Ligar alerta", "Seguir rápido"] },
        { q: "Dirigir com sono é:", a: "Tão perigoso quanto álcool", o: ["Normal", "Só perigoso acima de 100km/h", "Resolvido com café"] }
    ];

    let state = {
        money: parseInt(localStorage.getItem('otr32_m')) || 0,
        cars: JSON.parse(localStorage.getItem('otr32_c')) || [0],
        sel: parseInt(localStorage.getItem('otr32_s')) || 0,
        hp: 100, dist: 0, v: 0, active: false, px: 300, offset: 0,
        obs: [], qTimer: 0, used: [], lastTime: 0
    };

    const keys = {};
    window.onkeydown = e => keys[e.key] = true;
    window.onkeyup = e => keys[e.key] = false;

    function drawCar(ctx, x, y, color, type, isPlayer) {
        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = color;
        
        if (type === 'f1') {
            ctx.fillRect(-10, -45, 20, 40); // nose
            ctx.fillRect(-22, -10, 44, 45); // body
            ctx.fillStyle = '#000';
            ctx.fillRect(-35, -40, 70, 12); // f-wing
            ctx.fillRect(-35, 25, 70, 15);  // r-wing
            // Wheels
            ctx.fillRect(-32, -35, 12, 18); ctx.fillRect(20, -35, 12, 18);
            ctx.fillRect(-32, 15, 12, 22); ctx.fillRect(20, 15, 12, 22);
        } else {
            ctx.beginPath();
            ctx.roundRect(-22, -45, 44, 90, 10);
            ctx.fill();
            // Glass
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.fillRect(-18, -25, 36, 15);
            ctx.fillRect(-18, 25, 36, 10);
            // Wheels
            ctx.fillStyle = '#000';
            ctx.fillRect(-28, -35, 8, 18); ctx.fillRect(20, -35, 8, 18);
            ctx.fillRect(-28, 25, 8, 20); ctx.fillRect(20, 25, 8, 20);
        }
        ctx.restore();
    }

    function sync() {
        localStorage.setItem('otr32_m', state.money);
        localStorage.setItem('otr32_c', JSON.stringify(state.cars));
        localStorage.setItem('otr32_s', state.sel);
        document.getElementById('cash-txt').innerText = '$' + state.money;
    }

    function initRace() {
        state.hp = 100; state.dist = 0; state.v = 0; state.px = 300; state.qTimer = 0;
        state.obs = [];
        for(let i=0; i<40; i++) {
            state.obs.push({
                x: 180 + Math.random() * 240,
                y: -(i * 700) - 1000,
                c: ['#555','#336','#633'][i%3]
            });
        }
        state.active = true;
        state.lastTime = performance.now();
    }

    function showQuiz() {
        const q = QUIZ[Math.floor(Math.random() * QUIZ.length)];
        document.getElementById('q-text').innerText = q.q;
        const opts = document.getElementById('q-options');
        opts.innerHTML = '';
        [q.a, ...q.o].sort(() => Math.random() - 0.5).forEach(opt => {
            const b = document.createElement('button');
            b.className = 'btn-action'; style = 'width:100%';
            b.innerText = opt;
            b.onclick = () => {
                if (opt === q.a) { 
                    state.money += 100; sync(); 
                } else { 
                    state.hp = Math.max(0, state.hp - 30); // Penality: -30 durability
                    alert("Resposta Incorreta! -30% de Durabilidade.");
                }
                document.getElementById('screen-quiz').classList.add('hide');
                state.active = true; state.qTimer = 0;
            };
            opts.appendChild(b);
        });
        document.getElementById('screen-quiz').classList.remove('hide');
        state.active = false;
    }

    function loop(t) {
        if (state.active) {
            const dt = (t - state.lastTime) / 1000;
            state.lastTime = t;
            const car = CARS[state.sel];

            if (keys['w'] || keys['ArrowUp']) state.v += car.a;
            else if (keys['s'] || keys['ArrowDown']) state.v -= car.a; // REVERSE
            else state.v *= 0.98;

            if (keys['a'] || keys['ArrowLeft']) state.px -= 6;
            if (keys['d'] || keys['ArrowRight']) state.px += 6;

            state.v = Math.max(-car.s/2, Math.min(state.v, car.s));
            state.px = Math.max(160, Math.min(440, state.px));
            state.dist += state.v;
            state.offset = (state.offset + state.v) % 100;

            state.qTimer += dt;
            if (state.qTimer >= 10) showQuiz();

            state.obs.forEach(o => {
                o.y += state.v;
                if (Math.abs(o.x - state.px) < 45 && Math.abs(o.y - (canvas.height - 180)) < 80) {
                    state.hp -= 0.5;
                    state.v *= 0.95;
                }
            });

            if (state.hp <= 0) {
                state.active = false;
                document.getElementById('end-title').innerText = "FALHA NA MISSÃO";
                document.getElementById('end-desc').innerText = "Veículo danificado. Seja mais prudente!";
                document.getElementById('screen-end').classList.remove('hide');
            }

            if (state.dist >= 10000) {
                state.active = false; state.money += 500; sync();
                document.getElementById('end-title').innerText = "VITÓRIA!";
                document.getElementById('end-desc').innerText = "Você chegou com segurança. Recompensa: $500";
                document.getElementById('screen-end').classList.remove('hide');
            }

            document.getElementById('hp-fill').style.width = state.hp + '%';
            document.getElementById('dist-txt').innerText = Math.floor(state.dist / 10);
            document.getElementById('speed-num').innerText = Math.abs(Math.floor(state.v * 10));
            document.getElementById('p-marker').style.bottom = Math.min(295, (state.dist/10000)*295) + 'px';
        }

        // RENDER
        ctx.fillStyle = '#2d5a27'; ctx.fillRect(0,0,canvas.width,canvas.height); // Grass
        ctx.fillStyle = '#222'; ctx.fillRect(150, 0, 300, canvas.height); // Road
        ctx.fillStyle = '#fff'; ctx.fillRect(150, 0, 5, canvas.height); ctx.fillRect(445, 0, 5, canvas.height);
        
        ctx.setLineDash([40,40]); ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=4;
        ctx.beginPath(); ctx.moveTo(300, -100 + state.offset); ctx.lineTo(300, canvas.height + 100 + state.offset); ctx.stroke(); ctx.setLineDash([]);

        state.obs.forEach(o => drawCar(ctx, o.x, o.y + 45, o.c, 'sedan', false));
        drawCar(ctx, state.px, canvas.height - 180, CARS[state.sel].c, CARS[state.sel].type, true);

        requestAnimationFrame(loop);
    }

    // BUTTONS
    document.getElementById('start-race').onclick = () => {
        document.getElementById('screen-main').classList.add('hide'); initRace();
    };
    document.getElementById('open-shop').onclick = () => {
        const list = document.getElementById('shop-list'); list.innerHTML = '';
        CARS.forEach(v => {
            const has = state.cars.includes(v.id); const sel = state.sel === v.id;
            const div = document.createElement('div');
            div.style = "background:#111; padding:15px; border-radius:10px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; border: 1px solid "+(sel?'var(--safety-cyan)':'#333');
            div.innerHTML = `<div><b>${v.n}</b><br><small style="color:var(--caution-yellow)">${has?'COLECIONADO':'$'+v.p}</small></div><button class="btn-action" style="margin:0; padding:8px 15px;">${has?(sel?'EQUIPADO':'ESCOLHER'):'COMPRAR'}</button>`;
            div.querySelector('button').onclick = () => {
                if(!has && state.money >= v.p) { state.money -= v.p; state.cars.push(v.id); sync(); document.getElementById('open-shop').click(); }
                else if(has) { state.sel = v.id; sync(); document.getElementById('open-shop').click(); }
            };
            list.appendChild(div);
        });
        document.getElementById('screen-garage').classList.remove('hide');
    };
    document.getElementById('back-home').onclick = () => document.getElementById('screen-garage').classList.add('hide');
    document.getElementById('play-again').onclick = () => {
        document.getElementById('screen-end').classList.add('hide'); initRace();
    };

    function start() {
        canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
        sync(); loop(performance.now());
    }
    window.onresize = start;
    start();

</script>
</body>
</html>
